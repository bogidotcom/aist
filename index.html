<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AIST Exchange — P2P compute forex</title>
  <meta name="description" content="KGST is the rail: already on Binance. USDT in, compute-market out. No SWIFT.">
  <link rel="icon" href="assets/stork.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;1,9..40,400&family=IBM+Plex+Mono:wght@400;500&family=Sora:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body data-page="home">
  <header class="top" id="top"></header>
  <main class="hero">
    <div class="hero-in wrap">
      <img class="stork" src="assets/stork.svg" alt="Stork carrying a GPU">
      <p class="kicker" data-i18n="home.kicker">P2P compute forex</p>
      <h1 data-i18n-html="home.h">USDT in.<br>Compute out.</h1>
      <p class="lead" data-i18n="home.lead">KGST is the rail: already on Binance. USDT in, compute-market out. No SWIFT.</p>
      <a class="btn btn-lime" id="cta-market" data-i18n="home.cta">Open market</a>
      <div class="meshes" aria-label="meshes">
        <div class="mesh">USDT / KGST / aiETB · aiGEL · aiBTN</div>
        <div class="mesh">GELt / aiGEL / aiETB · aiBTN · KGST</div>
      </div>
    </div>
  </main>
  <footer class="foot" id="foot"></footer>
  <script src="js/i18n.js"></script>
  <script src="js/api.js"></script>
  <script src="js/wallets.js"></script>
  <script src="js/ui.js"></script>
  <script>
    AistUI.mountChrome();
    document.getElementById('cta-market').href = AistUI.href('market');
  </script>
</body>
</html>
